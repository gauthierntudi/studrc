services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/00-include-local.conf:/etc/nginx/conf.d/00-include-local.conf:ro
      - ./deploy/nginx/local:/etc/nginx/local-conf.d:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.opt1mum.com}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_CAPTCHA: ${CAPTCHA:-false}
        NEXT_PUBLIC_APP_URL: ${APP_URL:-https://opt1mum.com}
    env_file: .env
    environment:
      # SSR → API sur le réseau Docker (pas via HTTPS public)
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
    expose:
      - "3000"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      API_PORT: 3001
    command: node dist/main.js
    expose:
      - "3001"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      # Évite que pdf.js + canvas gonflent jusqu’à OOM kernel (~5 Go)
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=2048}
    command: node dist/worker.js
    # Cap container : tue le worker avant d’asphyxier le VPS (Chrononews, etc.)
    mem_limit: 2560m
    memswap_limit: 2560m
    restart: unless-stopped

volumes: {}
