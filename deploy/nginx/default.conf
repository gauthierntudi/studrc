upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:3001;
}

# HTTP → HTTPS + ACME challenge
server {
    listen 80;
    server_name studrc.com www.studrc.com api.studrc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name studrc.com www.studrc.com;

    ssl_certificate     /etc/letsencrypt/live/studrc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studrc.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PDF / médias CDN — stream nginx (évite timeout / troncature via Next).
    location /cdn-media/ {
        proxy_pass https://cdn.studrc.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host cdn.studrc.com;
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Fallback proxy Next (local / petits fichiers)
    location = /api/media-proxy {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.studrc.com;

    ssl_certificate     /etc/letsencrypt/live/studrc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studrc.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100M;

    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
