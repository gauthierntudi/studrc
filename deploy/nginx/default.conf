upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:3001;
}

# HTTP → HTTPS + ACME challenge
server {
    listen 80;
    server_name opt1mum.com www.opt1mum.com api.opt1mum.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name opt1mum.com www.opt1mum.com;

    ssl_certificate     /etc/letsencrypt/live/opt1mum.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opt1mum.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.opt1mum.com;

    ssl_certificate     /etc/letsencrypt/live/opt1mum.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opt1mum.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100M;

    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
